# Lab 9: receta de investigación de solo lectura para preparar el piloto.
# Basada en el patrón "investigate-question" de https://kiro.dev/docs/workflows/patterns/
# En el taller no hace falta escribirla: basta pedirle a Kiro el workflow en el chat (ver el README del Lab 9).
# Si la usas tal cual, revisa que el agente indicado exista en tu instalación.
name: investigar-piloto
inputs:
  brief: prompt
  report_path: file
steps:
  - type: step
    id: investigate
    agent: wf-planner
    artifacts:
      report: "{{report_path}}"
    prompt: >
      Investigación de solo lectura: no modifiques ningún archivo del proyecto.
      Investiga {{brief}}. Usa el código, la infraestructura, eval/reporte.md y los documentos de negocio/.
      Cita cada hallazgo con archivo. Separa riesgos técnicos, operativos y de costo, y para cada uno
      propone una mitigación. Escribe el informe en {{report_path}}.
